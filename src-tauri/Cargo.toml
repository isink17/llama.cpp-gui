[package]
name = "llamacppdesk-tauri"
version = "0.1.0"
description = "Tauri backend scaffold for the LlamaCppDesk migration"
edition = "2021"
publish = false

[lib]
name = "llamacppdesk_tauri"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-dialog = "2"
dirs = "6"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
