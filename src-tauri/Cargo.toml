[package]
name = "llamacppdesk-tauri"
version = "0.1.0"
description = "Tauri backend scaffold for the LlamaCppDesk migration"
edition = "2021"
publish = false

[lib]
name = "llamacppdesk_tauri"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
