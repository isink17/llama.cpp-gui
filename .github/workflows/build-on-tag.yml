name: Build On Tag

on:
  push:
    tags:
      - "v*"
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build and validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            publish: true
          - os: ubuntu-24.04
            publish: false
          - os: macos-15
            publish: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LlamaCppDesk.csproj

      - name: Build
        if: matrix.publish
        run: dotnet build LlamaCppDesk.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish EXE
        if: matrix.publish
        run: >
          dotnet publish LlamaCppDesk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishProfile=win-x64.pubxml
          --no-build

      - name: Package artifact
        if: matrix.publish
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/win-x64/publish"
          $zipPath = "$publishDir/LlamaCppDesk-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$publishDir/LlamaCppDesk.exe" -DestinationPath $zipPath
          Write-Output "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        if: matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: LlamaCppDesk-win-x64-${{ github.ref_name }}
          path: |
            bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/LlamaCppDesk.exe
            ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release Asset
        if: matrix.publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/LlamaCppDesk.exe
            ${{ env.ZIP_PATH }}
