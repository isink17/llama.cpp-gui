name: Build On Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-migration:
    name: Validate migration UI/Tauri path
    runs-on: ubuntu-24.04
    # Best-effort checks should not block the existing tag release job.
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Run smoke checks
        shell: bash
        run: ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check --include-cargo-check

  build:
    name: Build packaged artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact_path: src-tauri/target/release/bundle/**/*.msi
          - os: ubuntu-24.04
            artifact_path: src-tauri/target/release/bundle/**/*.AppImage
          - os: macos-15
            artifact_path: src-tauri/target/release/bundle/**/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LlamaCppDesk-${{ runner.os }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LlamaCppDesk-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LlamaCppDesk ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Downloads

            Download the installer for your system:
            - Windows: `.msi`
            - Linux: `.AppImage`
            - macOS: `.dmg`

            ## Changelog

            GitHub-generated release notes for `${{ github.ref_name }}` appear below.
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.dmg
