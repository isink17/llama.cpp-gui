name: Migration CI

on:
  push:
    branches:
      - "feature/migration/**"
  pull_request:
    branches:
      - "feature/multiplatform_support"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate UI and Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Windows icon asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iconPath = "src-tauri/icons/icon.ico"
          if (-not (Test-Path $iconPath)) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(256,256,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255,44,113,255))
            $hicon = $bmp.GetHicon()
            $icon = [System.Drawing.Icon]::FromHandle($hicon)
            $fs = [IO.File]::Open($iconPath,[IO.FileMode]::Create)
            $icon.Save($fs)
            $fs.Dispose()
            $g.Dispose()
            $bmp.Dispose()
          }

      - name: Run smoke checks
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check 2>&1 | tee smoke-checks.log

      - name: Upload smoke diagnostics
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-checks-diagnostics
          path: smoke-checks.log
          if-no-files-found: warn

      - name: Fail smoke checks
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test compile
        working-directory: src-tauri
        run: cargo test --locked --no-run

  validate-cross-platform:
    name: Cross-platform UI and Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Windows icon asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iconPath = "src-tauri/icons/icon.ico"
          if (-not (Test-Path $iconPath)) {
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(256,256,[System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255,44,113,255))
            $hicon = $bmp.GetHicon()
            $icon = [System.Drawing.Icon]::FromHandle($hicon)
            $fs = [IO.File]::Open($iconPath,[IO.FileMode]::Create)
            $icon.Save($fs)
            $fs.Dispose()
            $g.Dispose()
            $bmp.Dispose()
          }

      - name: Run smoke checks (Unix)
        if: runner.os != 'Windows'
        id: smoke_unix
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check 2>&1 | tee "smoke-checks-${{ matrix.os }}.log"

      - name: Upload smoke diagnostics (Unix)
        if: runner.os != 'Windows' && steps.smoke_unix.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-checks-diagnostics-${{ matrix.os }}
          path: smoke-checks-${{ matrix.os }}.log
          if-no-files-found: warn

      - name: Fail smoke checks (Unix)
        if: runner.os != 'Windows' && steps.smoke_unix.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Run smoke checks (Windows)
        if: runner.os == 'Windows'
        id: smoke_windows
        shell: pwsh
        continue-on-error: true
        run: |
          ./tests/smoke/Invoke-SmokeChecks.ps1 -SkipPrereqCheck 2>&1 | Tee-Object -FilePath "smoke-checks-${{ matrix.os }}.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke diagnostics (Windows)
        if: runner.os == 'Windows' && steps.smoke_windows.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-checks-diagnostics-${{ matrix.os }}
          path: smoke-checks-${{ matrix.os }}.log
          if-no-files-found: warn

      - name: Fail smoke checks (Windows)
        if: runner.os == 'Windows' && steps.smoke_windows.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked
