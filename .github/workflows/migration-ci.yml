name: Migration CI

on:
  push:
    branches:
      - "feature/migration/**"
  pull_request:
    branches:
      - "feature/multiplatform_support"

jobs:
  validate:
    name: Validate UI and Rust checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run smoke checks
        shell: bash
        run: ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test compile
        working-directory: src-tauri
        run: cargo test --locked --no-run
