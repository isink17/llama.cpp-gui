name: Migration CI

on:
  push:
    branches:
      - "feature/migration/**"
  pull_request:
    branches:
      - "feature/multiplatform_support"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate UI and Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run smoke checks
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check 2>&1 | tee smoke-checks.log

      - name: Upload smoke diagnostics
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-checks-diagnostics
          path: smoke-checks.log
          if-no-files-found: error

      - name: Fail smoke checks
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test compile
        working-directory: src-tauri
        run: cargo test --locked --no-run

  validate-cross-platform:
    name: Cross-platform UI and Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run smoke checks (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check

      - name: Run smoke checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke/Invoke-SmokeChecks.ps1 -SkipPrereqCheck

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked
