name: Migration CI

on:
  push:
    branches:
      - "feature/migration/**"
  pull_request:
    branches:
      - "feature/multiplatform_support"

jobs:
  validate:
    name: Validate UI and Rust checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run smoke checks
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./tests/smoke/Invoke-SmokeChecks.sh --skip-prereq-check 2>&1 | tee smoke-checks.log

      - name: Upload smoke diagnostics
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-checks-diagnostics
          path: smoke-checks.log
          if-no-files-found: error

      - name: Fail smoke checks
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test compile
        working-directory: src-tauri
        run: cargo test --locked --no-run
